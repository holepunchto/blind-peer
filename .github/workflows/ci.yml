name: Build Status
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    name: Security
    steps:
      - uses: holepunchto/actions/security-base@v1
  build:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Put temp dirs on a Dev Drive
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'dev-drive.vhdx'
          $volume = New-VHD -Path $vhd -SizeBytes 50GB -Dynamic |
            Mount-VHD -Passthru |
            Initialize-Disk -PartitionStyle GPT -PassThru |
            New-Partition -AssignDriveLetter -UseMaximumSize |
            Format-Volume -DevDrive -Confirm:$false -Force
          $tmp = "$($volume.DriveLetter):\tmp"
          New-Item -ItemType Directory -Path $tmp | Out-Null
          "TMP=$tmp" >> $env:GITHUB_ENV
          "TEMP=$tmp" >> $env:GITHUB_ENV
      - uses: holepunchto/actions/bare-base@v1
      - run: npm test
      - run: npm run test:bare
  test-netns:
    runs-on: ubuntu-latest
    steps:
      - uses: holepunchto/actions/node-base@v1
      - name: Setup network namespaces
        run: sudo test-netns/scripts/setup.sh
      - name: Run netns tests
        run: sudo npm run test:netns
      - name: Teardown network namespaces
        if: always()
        run: sudo test-netns/scripts/teardown.sh
