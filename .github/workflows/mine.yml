name: Mine Tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/mine.yml
permissions:
  contents: read
jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        file:
          - test/autobase.js
          - test/autobee.js
          - test/client.js
          - test/core.js
          - test/gc.js
          - test/metrics.js
          - test/notifications.js
          - test/trusted-peers.js
    name: Mine ${{ matrix.file }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - run: timeout 10m ./node_modules/.bin/brittle-bare -m 4 ${{ matrix.file }} || [ $? -eq 124 ]
