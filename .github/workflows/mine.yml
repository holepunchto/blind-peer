name: Mine Tests
on:
  workflow_dispatch:
    inputs:
      os:
        description: Platforms to mine on
        type: string
        default: '["windows-latest"]'
      files:
        description: Test files to mine
        type: string
        default: '["test/autobase.js", "test/autobee.js", "test/client.js", "test/core.js", "test/gc.js", "test/metrics.js", "test/notifications.js", "test/trusted-peers.js"]'
      miners:
        description: Number of mining processes per job
        type: number
        default: 4
permissions:
  contents: read
jobs:
  mine:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        file: ${{ fromJSON(inputs.files) }}
    name: Mine ${{ matrix.file }} (${{ matrix.os }})
    steps:
      - name: Disable Defender real-time scanning
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - name: Put temp dirs on a Dev Drive
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'dev-drive.vhdx'
          $volume = New-VHD -Path $vhd -SizeBytes 50GB -Dynamic |
            Mount-VHD -Passthru |
            Initialize-Disk -PartitionStyle GPT -PassThru |
            New-Partition -AssignDriveLetter -UseMaximumSize |
            Format-Volume -DevDrive -Confirm:$false -Force
          $tmp = "$($volume.DriveLetter):\tmp"
          New-Item -ItemType Directory -Path $tmp | Out-Null
          "TMP=$tmp" >> $env:GITHUB_ENV
          "TEMP=$tmp" >> $env:GITHUB_ENV
      - uses: holepunchto/actions/bare-base@v1
      - shell: bash
        env:
          FILE: ${{ matrix.file }}
          MINERS: ${{ inputs.miners }}
        run: timeout 15m ./node_modules/.bin/brittle-bare -m "$MINERS" "$FILE" || [ $? -eq 124 ]
