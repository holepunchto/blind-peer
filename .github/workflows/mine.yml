name: Mine Tests
on:
  workflow_dispatch:
    inputs:
      os:
        description: Platforms to mine on
        type: string
        default: '["windows-latest"]'
      files:
        description: Test files to mine
        type: string
        default: '["test/autobase.js", "test/autobee.js", "test/client.js", "test/core.js", "test/gc.js", "test/metrics.js", "test/notifications.js", "test/trusted-peers.js"]'
      miners:
        description: Number of mining processes per job
        type: number
        default: 4
permissions:
  contents: read
jobs:
  mine:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        file: ${{ fromJSON(inputs.files) }}
    name: Mine ${{ matrix.file }} (${{ matrix.os }})
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - name: Dependency versions
        shell: bash
        run: |
          bare --version || true
          npm ls bare-subprocess udx-native rocksdb-native sodium-native hyperdht hyperswarm corestore hypercore autobase blind-peering || true
      - name: Enable crash dumps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value "$env:RUNNER_TEMP\dumps" -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 5 -PropertyType DWord -Force | Out-Null
      - name: Mine
        shell: bash
        env:
          FILE: ${{ matrix.file }}
          MINERS: ${{ inputs.miners }}
        run: timeout 15m ./node_modules/.bin/brittle-bare -m "$MINERS" "$FILE" || [ $? -eq 124 ]
      - name: Windows crash events
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'Application Error', 'Windows Error Reporting' } -MaxEvents 20 -ErrorAction SilentlyContinue | Format-List TimeCreated, Id, ProviderName, Message
      - name: Upload crash dumps
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps-${{ strategy.job-index }}
          path: ${{ runner.temp }}/dumps
          if-no-files-found: ignore
